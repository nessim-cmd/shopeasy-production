services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppassword
      POSTGRES_DB: shopdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d shopdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: shop_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  app:
    build: .
    container_name: shop_app
    restart: unless-stopped
    env_file: .env
    environment:
      PROJECT_ROOT: /app
      DATABASE_URL: ${DATABASE_URL}
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Points at the model baked into the image during `docker build`
      # (see Dockerfile) — NOT under /app, so the bind mount below never
      # hides it. Runtime never touches the network for this model.
      FASTEMBED_CACHE_DIR: /opt/fastembed-cache
    command: >
      sh -c "npm run seed:all && npm run dev"
    ports:
      - "4111:4111"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: