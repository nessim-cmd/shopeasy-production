name: agent-with-ollama
services:
  agent_db:
    image: pgvector/pgvector:pg16
    container_name: agent_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppassword
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d agent_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  store_db:
    image: postgres:16-alpine
    container_name: agent_store_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppassword
      POSTGRES_DB: store_db
    ports:
      - "5434:5432"
    volumes:
      - store_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d store_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: agent_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    image: curlimages/curl:latest
    container_name: agent_ollama_init
    depends_on:
      - ollama
    entrypoint: ["sh", "-c", "sleep 5 && curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen3.5:9b\"}' && echo 'Model pulled successfully'"]

  agent:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: agent_app
    restart: unless-stopped
    env_file: .env.ollama
    environment:
      PROJECT_ROOT: /app
      DATABASE_URL: postgresql://shopuser:shoppassword@agent_db:5432/agent_db
      STORE_DATABASE_URL: postgresql://shopuser:shoppassword@store_db:5432/store_db
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: qwen3.5:9b
      CI: true
    command: sh -c "pnpm run seed:all && pnpm run dev"
    ports:
      - "4111:4111"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      agent_db:
        condition: service_healthy
      store_db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  agent_pgdata:
  store_pgdata:
  ollama_data:
