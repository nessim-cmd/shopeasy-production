name: Build and deploy Node.js app to Azure Web App - medusa-app
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
      - name: Install dependencies (monorepo root)
        run: pnpm install --frozen-lockfile
      - name: Build Medusa backend
        run: pnpm turbo run build --filter=@dtc/backend
      - name: Deploy production-only package
        run: pnpm --filter=@dtc/backend deploy --prod --legacy ./deploy-medusa
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Zip artifact for deployment
        run: zip -r ../release.zip ./* -x "*.git*"
        working-directory: ./deploy-medusa
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Unzip artifact for deployment
        run: unzip release.zip
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'medusa-app'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
