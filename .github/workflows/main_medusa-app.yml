build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies (monorepo root)
        run: pnpm install --frozen-lockfile

      - name: Build Medusa backend
        run: pnpm turbo run build --filter=@dtc/backend

      - name: Deploy production-only package
        run: pnpm --filter=@dtc/backend deploy --prod ./deploy-medusa

      - name: Zip artifact for deployment
        run: zip -r ../../release.zip ./* -x "*.git*"
        working-directory: ./deploy-medusa

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
